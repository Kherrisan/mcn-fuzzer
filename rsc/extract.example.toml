# Settings for the independent `rsc extract` workflow.
[extract]
model = "openai-codex:gpt-6-luna"
effort = "high"
context_tokens = 258400
batch_target_tokens = 8000
batch_max_tokens = 12000
max_requests_per_assignment = 96
max_interaction_requests_per_assignment = 128
max_tool_calls_per_assignment = 256
# Store large tool results as block references instead of full text.
history_tool_chars = 1200
keep_full_turns = 2
stub_before_drop = true
max_global_validation_attempts = 6 # Includes the initial check.
run_timeout_seconds = 7200
# Review every batch after all scan passes, then fix gaps grouped by document.
review_enabled = true
review_requests_per_second = 5 # Global throttle, retries included.
review_concurrency = 3 # Reviewers running at the same time; use 2 if the provider 429s.
gap_group_max = 8 # Gaps per document-level gap assignment.
# enabled_extensions = ["RFC 3659"]
