[workflow]
batch_target_tokens = 8000
batch_max_tokens = 12000
parse_workers = 3
merge_workers = 3
max_feedback_rounds = 2 # Feedback corrections after the initial pass, including regrouping.

[agents]
default_profile = "codex-luna-max"
# parser_profile = "pi-deepseek-flash"
# merge_profile = "codex-luna-max"

[agents.profiles.codex-luna-max]
provider = "codex"
executable = "codex"
model = "gpt-6-luna"
effort = "max"
args = []
envs = []

[agents.profiles.codex-luna-high]
provider = "codex"
executable = "codex"
model = "gpt-6-luna"
effort = "high"
args = []
envs = []

[agents.profiles.pi-deepseek-flash]
provider = "pi"
executable = "pi"
model = "deepseek/deepseek-flash"
effort = "high"
args = []
# Optional: [["SSL_CERT_FILE", "/path/to/ca.pem"]]
envs = []
