[project]
name = "generator-server"
version = "0.1.0"
description = "iceoryx2 generator server for mcn-fuzz"
requires-python = ">=3.10"
dependencies = [
    "cbor2==5.6.5",
    "iceoryx2==0.8.1",
    "mcp==2.3.0",
    "pydantic==2.14.2",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-cpp>=0.23,<0.24",
]

[tool.unittest]
# Tests are discovered with `python -m unittest`.
