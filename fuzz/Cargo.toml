[package]
name = "mcn-fuzz"
version = "0.1.0"
edition = "2021"
description = "Forkserver fuzzer with PCGUARD feedback and a Python generator"
license = "MIT OR Apache-2.0"

[lib]
name = "mcn_fuzz"
path = "src/lib.rs"

[[bin]]
name = "mcn-fuzz"
path = "src/main.rs"

[dependencies]
ciborium = "0.2.2"
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"
flate2 = "1.0"
iceoryx2 = "=0.8.1"
libc = "0.2.177"
libafl = { version = "=0.16.1", features = ["std", "prelude", "derive"] }
libafl_bolts = { version = "=0.16.1", features = ["std", "prelude"] }
log = "0.4.28"
nix = { version = "0.31.1", features = ["fs", "mount", "poll", "process", "sched", "signal"] }
pcap = "2.2.0"
pcap-file = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"

[dev-dependencies]
serial_test = "3.2.0"

[features]
# Phase timings, benchmark counters, and `bench-capture`. Off unless requested.
stats = []
